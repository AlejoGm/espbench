<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>espbench — monitor</title>
    <link rel="stylesheet" href="/style.css">
    <script src="/espbench.js"></script>
    <script src="/auth.js"></script>
</head>
<body class="device-page">

    <div class="device-header">
        <a class="back-link" href="/">← inicio</a>
        <span class="separator">/</span>
        <span class="device-name" id="device-name"></span>
        <div class="device-badges" id="device-badges"></div>
        <div class="device-badges" id="health-badges"></div>
        <span class="status-dot" id="status-dot"></span>
        <span class="status-label" id="status-label">Conectando...</span>
        <div class="header-actions">
            <button class="action-btn hidden" id="btn-release" title="Liberar la reserva/lock con su lock_user y lock_token">🔓 Liberar</button>
            <button class="action-btn action-btn--danger hidden" id="btn-force" title="Soltar la reserva/lock de otro (queda registrado como forzado)">⚠ Forzar</button>
            <button class="action-btn" id="btn-reset" title="Reset (Ctrl+T Ctrl+R)">↺ Reset</button>
            <button class="action-btn" id="btn-bootloader" title="Bootloader (Ctrl+T Ctrl+P)">⚙ Boot</button>
            <button class="action-btn action-btn--danger" id="btn-devremote-reset" title="Reiniciar sesión devremote (mata y relanza el proceso)">⟳ Sesión</button>
        </div>
    </div>

    <div class="term-toolbar">
        <input id="filter" class="filter-input" type="search" placeholder="Filtrar líneas…  ( / )" autocomplete="off">
        <button class="tool-btn" id="btn-problems" title="Mostrar solo panics, resets, errores y warnings">⚠ Solo problemas</button>
        <button class="tool-btn tool-btn--panic hidden" id="btn-panic" title="Ir al último panic">⤒ Último panic</button>
        <button class="tool-btn" id="btn-ts" title="Mostrar la hora de cada línea (la pone la Pi al recibirla)">🕑 Hora</button>
        <span class="tool-sep"></span>
        <span class="line-count" id="line-count"></span>
        <button class="tool-btn" id="btn-follow" title="Seguir el final del log (End)">⏸ Pausar</button>
        <button class="tool-btn" id="btn-clear" title="Limpiar la vista (el archivo no se toca)">⌫ Limpiar</button>
        <a class="tool-btn" id="btn-download" title="Descargar la sesión actual completa">⤓ Log</a>
        <button class="tool-btn" id="btn-history" title="Eventos, flasheos y sesiones anteriores">☰ Historial</button>
    </div>

    <div class="device-main">
        <div class="term-wrap">
            <div id="terminal" class="terminal"></div>
            <button class="new-lines hidden" id="new-lines">↓ <span id="new-lines-n">0</span> líneas nuevas</button>
        </div>
        <aside class="side-panel hidden" id="side-panel">
            <div class="side-tabs">
                <button class="side-tab active" data-tab="events">Eventos</button>
                <button class="side-tab" data-tab="jobs">Flasheos</button>
                <button class="side-tab" data-tab="sessions">Sesiones</button>
                <button class="side-close" id="side-close" title="Cerrar">✕</button>
            </div>
            <div class="side-body" id="side-events"></div>
            <div class="side-body hidden" id="side-jobs"></div>
            <div class="side-body hidden" id="side-sessions"></div>
        </aside>
    </div>

    <form class="serial-input" id="serial-form" autocomplete="off">
        <span class="prompt">›</span>
        <input id="serial-text" placeholder="Enviar al serial del device…  (↑↓ historial)" maxlength="256">
        <label class="enter-opt" title="Mandar Enter después del texto"><input type="checkbox" id="serial-enter" checked> ⏎</label>
        <button class="action-btn" type="submit">Enviar</button>
    </form>

    <div class="viewer hidden" id="viewer">
        <div class="viewer-box">
            <div class="viewer-head">
                <span class="viewer-title" id="viewer-title"></span>
                <a class="tool-btn" id="viewer-download" target="_blank">⤓ Descargar</a>
                <button class="tool-btn" id="viewer-close">✕ Cerrar</button>
            </div>
            <div class="terminal viewer-body" id="viewer-body"></div>
        </div>
    </div>

    <div class="toast hidden" id="toast"></div>

    <script>
        var params = new URLSearchParams(window.location.search);
        var tty = params.get('tty') || '';
        var api = '/api/device/' + encodeURIComponent(tty);
        var $ = function(id) { return document.getElementById(id); };
        var terminal = $('terminal');
        var ws = null;
        var reconnectTimer = null;
        var currentLock = null;     // EB.lockInfo del último /api/device/{tty}
        var apiAuth = false;        // la Pi tiene token de la API (/api/version): sin él no se fuerza un unlock
        var boardKey = '';          // MAC sin separadores: /api/board/{key} (lecturas por placa)
        var boardApi = '';
        var deviceLoaded = false;
        var curSession = null;      // sesión actual de la placa (de /events)

        var MAX_LINES = 20000;   // tope de líneas en la vista; el archivo completo se descarga

        // ── Terminal: render incremental ──────────────────────────────────────
        // Cada línea completa es un <div>; la línea en curso (sin \n todavía) es
        // el último, y se reescribe en cada mensaje. Nunca se re-renderiza todo.
        var buffer = new EB.LineBuffer();
        var partialEl = null;
        var follow = true;
        var unseen = 0;
        var dropped = 0;
        var filterText = '';
        var onlyProblems = false;
        var lastPanicEl = null;
        var showTs = true;
        try { showTs = localStorage.getItem('eb.showTs') !== '0'; } catch (e) {}

        // Cada línea del archivo trae "YYYY-MM-DD HH:MM:SS.mmm <origen> " (DeviceLog).
        // La hora va en su propio span (toggle "Hora"); clase, filtro y colores
        // miran el cuerpo. Los logs viejos no tienen prefijo y se ven como antes.
        // Marca al costado: panic/boot por el contenido de la línea (lineMark);
        // send/command/flash se agregan después, por evento (markEvent).
        var MARK_ICONS = {panic: '⚠', boot: '↻'};

        function makeLine(text, el, noFilter) {
            el = el || document.createElement('div');
            var p = EB.splitPrefix(text);
            var plain = EB.stripAnsi(p.body);
            var cls = EB.lineClass(EB.stripAnsi(text));
            var mk = EB.lineMark(text);
            el.className = 'ln' + (cls ? ' ' + cls : '') + (p.origin === '\u21aa' ? ' ln-cont' : '') +
                           (mk ? ' mk mk-' + mk : '');
            if (mk) el.dataset.mk = MARK_ICONS[mk]; else delete el.dataset.mk;
            var ts = p.time ? '<span class="ln-ts" title="' + p.date + ' ' + p.time + '">' + p.time + '</span>' : '';
            el.innerHTML = ts + '<span class="ln-body">' + (EB.ansiLineToHtml(p.body) || '\u200b') + '</span>';
            el._plain = plain.toLowerCase();
            el._cls = cls;
            el._iso = p.time ? p.date + 'T' + p.time : null;
            if (!noFilter) applyFilterTo(el);
            return el;
        }

        function markEvent(el, ev) {
            var v = EB.eventView(ev);
            el.dataset.mk = v.icon;
            el.classList.add('mk', 'mk-ev', 'mk-' + ev.type);
            var what = v.label + (v.detail ? ' ' + v.detail : '') + (v.who ? ' · ' + v.who : '');
            el.title = (el.title ? el.title + '\n' : '') + what;
        }

        // ── Marcas de send/command/flash en el vivo ───────────────────────────
        // El WebSocket manda texto sin offsets: los eventos del api se ubican por
        // hora (EB.EventMarks: la primera línea con hora ≥ la del evento − 500 ms).
        var marks = new EB.EventMarks();

        function takeMarks(el) {
            if (!el._iso) return;
            marks.take(el._iso).forEach(function(ev) { markEvent(el, ev); });
        }

        function lastLine() {
            var el = partialEl ? partialEl.previousSibling : terminal.lastChild;
            return el && el._iso !== undefined ? el : null;
        }

        function scanMarks() {
            var last = lastLine();
            if (!last || !last._iso || !marks.dueBy(last._iso)) return;
            var first = true;
            for (var el = terminal.firstChild; el && el !== partialEl; el = el.nextSibling) {
                if (!el._iso) continue;
                if (first) { marks.dropBefore(el._iso); first = false; }   // anteriores a la vista (recortada/limpia)
                takeMarks(el);
            }
        }

        function pollMarks() {
            if (!boardApi) return;
            fetch(boardApi + '/events?type=send,command,flash&since=session&limit=200')
                .then(function(r) { return r.ok ? r.json() : null; })
                .then(function(d) {
                    if (!d) return;
                    curSession = d.session || curSession;
                    if (marks.add(d.events)) scanMarks();
                })
                .catch(function() {});
        }

        function visible(el) {
            if (onlyProblems && !EB.isProblem(el._cls)) return false;
            return !filterText || el._plain.indexOf(filterText) >= 0;
        }

        function applyFilterTo(el) { el.classList.toggle('hidden', !visible(el)); }

        function appendText(text) {
            var lines = buffer.push(text);
            if (!partialEl) {
                partialEl = document.createElement('div');
                terminal.appendChild(partialEl);
            }
            if (lines.length) {
                var frag = document.createDocumentFragment();
                lines.forEach(function(l) {
                    var el = makeLine(l);
                    if (el._cls === 'ln-panic') lastPanicEl = el;
                    takeMarks(el);
                    frag.appendChild(el);
                });
                terminal.insertBefore(frag, partialEl);
                trim();
                if (!follow) unseen += lines.length;
            }
            makeLine(buffer.partialView(), partialEl);
            partialEl.classList.add('ln-partial');
            if (follow) terminal.scrollTop = terminal.scrollHeight;
            updateCounters();
        }

        function trim() {
            var extra = terminal.childElementCount - 1 - MAX_LINES;
            for (; extra > 0; extra--) {
                if (terminal.firstChild === lastPanicEl) lastPanicEl = null;
                terminal.removeChild(terminal.firstChild);
                dropped++;
            }
        }

        function updateCounters() {
            var n = terminal.childElementCount - (partialEl ? 1 : 0);
            $('line-count').textContent = n.toLocaleString('es-AR') + ' líneas' +
                (dropped ? ' (' + dropped.toLocaleString('es-AR') + ' recortadas)' : '');
            $('new-lines-n').textContent = unseen;
            $('new-lines').classList.toggle('hidden', follow || unseen === 0);
            $('btn-panic').classList.toggle('hidden', !lastPanicEl);
            $('btn-follow').textContent = follow ? '⏸ Pausar' : '▶ Seguir';
            $('btn-follow').classList.toggle('active', !follow);
        }

        function setFollow(on) {
            follow = on;
            if (on) { unseen = 0; terminal.scrollTop = terminal.scrollHeight; }
            updateCounters();
        }

        function isAtBottom() {
            return terminal.scrollHeight - terminal.scrollTop - terminal.clientHeight < 40;
        }

        terminal.addEventListener('scroll', function() {
            var bottom = isAtBottom();
            if (bottom && !follow) setFollow(true);
            else if (!bottom && follow) { follow = false; updateCounters(); }
        });

        function refilter() {
            for (var el = terminal.firstChild; el; el = el.nextSibling) {
                if (el._plain !== undefined) applyFilterTo(el);
            }
            terminal.classList.toggle('filtered', !!filterText || onlyProblems);
            if (follow) terminal.scrollTop = terminal.scrollHeight;
        }

        function clearView() {
            terminal.innerHTML = '';
            partialEl = null;
            lastPanicEl = null;
            dropped = unseen = 0;
            updateCounters();
        }

        function jumpToPanic() {
            if (!lastPanicEl) return;
            if (lastPanicEl.classList.contains('hidden')) { filterText = ''; $('filter').value = ''; refilter(); }
            follow = false;
            lastPanicEl.scrollIntoView({block: 'center'});
            lastPanicEl.classList.remove('flash');
            void lastPanicEl.offsetWidth;
            lastPanicEl.classList.add('flash');
            updateCounters();
        }

        // ── Header: badges del device y de salud ─────────────────────────────
        function makeBadge(label, value, extraClass) {
            return '<span class="dev-badge' + (extraClass ? ' ' + extraClass : '') + '">' +
                   '<span class="dev-badge-label">' + EB.escapeHtml(label) + '</span>' +
                   '<span class="dev-badge-value">' + EB.escapeHtml(value) + '</span></span>';
        }

        // 🔒 reserva | juan · vence en 20 min  (el "vence en" lo actualiza tickLocks)
        function lockBadge(lock) {
            return '<span class="dev-badge badge-locked" title="' + EB.escapeHtml(lock.title) + '">' +
                   '<span class="dev-badge-label">🔒 ' + (lock.reservation ? 'reserva' : 'lock flash') + '</span>' +
                   '<span class="dev-badge-value">' + EB.escapeHtml(lock.user) + ' · <span class="lock-exp"' +
                   (lock.expires ? ' data-expires="' + EB.escapeHtml(lock.expires) + '"' : '') + '>' +
                   EB.escapeHtml(lock.text) + '</span></span></span>';
        }

        // Cada segundo: "vence en" sin recargar; al vencer desaparece (el server ya la ignora).
        function tickLocks() {
            var expired = false;
            document.querySelectorAll('.lock-exp[data-expires]').forEach(function(el) {
                var t = EB.expiresText(el.dataset.expires);
                if (t) { el.textContent = t; return; }
                el.closest('.dev-badge').remove();
                expired = true;
            });
            if (expired) {
                currentLock = null;
                $('btn-release').classList.add('hidden');
                $('btn-force').classList.add('hidden');
                loadDeviceInfo();
            }
        }

        // ── Reserva: liberar (con el par) y forzar ───────────────────────────
        // El par lock_user/lock_token se puede recordar (localStorage): con él,
        // "Liberar" no pregunta y las escrituras del dashboard salen como del dueño.
        function getPair() {
            try {
                var u = localStorage.getItem('eb.lockUser') || '', t = localStorage.getItem('eb.lockToken') || '';
                return u && t ? {user: u, token: t} : null;
            } catch (e) { return null; }
        }

        function setPair(user, token) {
            try { localStorage.setItem('eb.lockUser', user); localStorage.setItem('eb.lockToken', token); } catch (e) {}
        }

        function postWrite(path, body) {
            return EBAuth.fetch(api + path, {
                method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body || {})
            }).then(function(r) {
                return r.json().catch(function() { return null; })
                        .then(function(d) { return [r.ok, r.status, d]; });
            });
        }

        function release(user, token, remember) {
            return postWrite('/release', {lock_user: user, lock_token: token}).then(function(res) {
                if (!res[0]) return EB.errorText(res[2], res[1]);
                if (remember) setPair(user, token);
                toast('Reserva liberada');
                loadDeviceInfo();
                return null;
            });
        }

        // Barra inline (como la del token de la API) para el par del dueño.
        function askPair(lock, error) {
            var old = document.querySelector('.lock-bar');
            if (old) old.remove();
            var pair = getPair();
            var bar = document.createElement('form');
            bar.className = 'token-bar lock-bar';
            bar.innerHTML = '<span>Liberar la reserva de <b>' + EB.escapeHtml(lock.user) + '</b></span>' +
                '<input name="user" placeholder="lock_user" autocomplete="off">' +
                '<input name="token" type="password" placeholder="lock_token" autocomplete="off">' +
                '<label class="enter-opt"><input type="checkbox" name="remember"' + (pair ? ' checked' : '') + '> recordar</label>' +
                '<button type="submit" class="action-btn">Liberar</button>' +
                '<button type="button" class="tool-btn">Cancelar</button>' +
                (error ? '<span class="lock-bar-err">' + EB.escapeHtml(error) + '</span>' : '');
            document.body.appendChild(bar);
            bar.user.value = lock.user;
            (bar.user.value ? bar.token : bar.user).focus();
            bar.querySelector('button[type=button]').onclick = function() { bar.remove(); };
            bar.onsubmit = function(e) {
                e.preventDefault();
                var u = bar.user.value.trim(), t = bar.token.value.trim();
                if (!u || !t) return;
                bar.remove();
                release(u, t, bar.remember.checked)
                    .then(function(err) { if (err) askPair(lock, err); })
                    .catch(function() { toast('Error de conexión', true); });
            };
        }

        function onRelease() {
            if (!currentLock) return;
            var pair = getPair();
            if (!pair || pair.user !== currentLock.user) { askPair(currentLock); return; }
            var lock = currentLock;
            release(pair.user, pair.token, false)
                .then(function(err) { if (err) askPair(lock, err); })
                .catch(function() { toast('Error de conexión', true); });
        }

        function onForce() {
            if (!currentLock) return;
            if (!confirm(EB.forceConfirmText(currentLock, 'Soltarla'))) return;
            postWrite('/unlock', {force: true})
                .then(function(res) {
                    if (!res[0]) { toast(EB.errorText(res[2], res[1]), true); return; }
                    toast(res[2] && res[2].forced ? 'Reserva de ' + res[2].user + ' soltada (forzado)' : 'No estaba bloqueada');
                    loadDeviceInfo();
                })
                .catch(function() { toast('Error de conexión', true); });
        }

        var STATE_LABELS = {discovering: 'iniciando', flashing: 'flasheando', erasing: 'borrando',
                            unknown: 'sin MAC', disconnected: 'desconectado'};

        function loadDeviceInfo() {
            return fetch(api)
                .then(function(r) { return r.ok ? r.json() : null; })
                .then(function(d) {
                    var badges = [];
                    var name = tty;
                    deviceLoaded = true;
                    if (d && d.mac && !boardKey) {
                        boardKey = d.mac.replace(/[:-]/g, '');
                        boardApi = '/api/board/' + encodeURIComponent(boardKey);
                        pollMarks();
                        if (sideTab === 'events') loadHistory();
                    }
                    if (d) {
                        name = d.device_key || d.hw_model || tty;
                        if (d.state && STATE_LABELS[d.state]) badges.push(makeBadge('estado', STATE_LABELS[d.state], 'badge-state-' + d.state));
                        if (d.device_key && d.device_key !== tty) badges.push(makeBadge('tty', tty));
                        if (d.port_tcp)        badges.push(makeBadge('tcp', ':' + d.port_tcp));
                        if (d.hw_model && d.hw_model !== name) badges.push(makeBadge('hw', d.hw_model));
                        if (d.sn)              badges.push(makeBadge('sn', d.sn));
                        if (d.fw_version)      badges.push(makeBadge('fw', (d.fw_project ? d.fw_project + ' ' : '') + d.fw_version));
                        if (d.fw_idf)          badges.push(makeBadge('idf', d.fw_idf));
                        if (d.last_flash_ts) {
                            var mark = d.last_flash_ok === false ? '✗ ' : d.last_flash_ok === true ? '✓ ' : '';
                            badges.push(makeBadge('flash', mark + EB.relTime(d.last_flash_ts) +
                                                  (d.last_flash_user ? ' · ' + d.last_flash_user : ''),
                                                  d.last_flash_ok === false ? 'badge-fail' : ''));
                        }
                        currentLock = EB.lockInfo(d);
                        if (currentLock) badges.push(lockBadge(currentLock));
                        $('health-badges').innerHTML = EB.healthBadges(d.health).map(function(x) {
                            return '<span class="hbadge ' + x.cls + '" title="' + EB.escapeHtml(x.title) + '">' + EB.escapeHtml(x.text) + '</span>';
                        }).join('');
                        var busy = d.state === 'flashing' || d.state === 'erasing';
                        $('serial-text').disabled = busy;
                        $('serial-text').placeholder = busy ? 'Device ocupado (' + STATE_LABELS[d.state] + ')…'
                                                            : 'Enviar al serial del device…  (↑↓ historial)';
                    }
                    $('device-name').textContent = name;
                    document.title = 'espbench — ' + name;
                    $('device-badges').innerHTML = badges.join('');
                    if (!d) currentLock = null;
                    $('btn-release').classList.toggle('hidden', !currentLock);
                    $('btn-force').classList.toggle('hidden', !currentLock || !apiAuth);
                    return d;
                })
                .catch(function() { $('device-badges').innerHTML = makeBadge('tty', tty); });
        }

        // ── Historial: flasheos y sesiones ────────────────────────────────────
        var sideTab = 'events';

        function panelOpen() { return !$('side-panel').classList.contains('hidden'); }

        function toggleHistory(open) {
            $('side-panel').classList.toggle('hidden', !open);
            $('btn-history').classList.toggle('active', open);
            if (open) loadHistory();
        }

        function loadHistory() {
            if (!panelOpen()) return;
            if (sideTab === 'events') {
                loadEvents();
            } else if (sideTab === 'jobs') {
                fetch(api + '/jobs').then(function(r) { return r.json(); }).then(renderJobs)
                    .catch(function() { $('side-jobs').innerHTML = '<div class="side-empty">Error al leer el historial</div>'; });
            } else {
                fetch(api + '/sessions').then(function(r) { return r.json(); }).then(renderSessions)
                    .catch(function() { $('side-sessions').innerHTML = '<div class="side-empty">Error al leer las sesiones</div>'; });
            }
        }

        function renderJobs(jobs) {
            if (!jobs.length) { $('side-jobs').innerHTML = '<div class="side-empty">Sin flasheos registrados</div>'; return; }
            $('side-jobs').innerHTML = jobs.map(function(j) {
                var cls = j.ok === true ? 'ok' : j.ok === false ? 'fail' : 'unk';
                var icon = j.ok === true ? '✓' : j.ok === false ? '✗' : '·';
                var detail = j.ok === false ? (j.error ? j.error.replace(/_/g, ' ') : '') + (j.message ? ': ' + j.message : '')
                           : j.status || '';
                return '<div class="hist-item hist-' + cls + '">' +
                         '<span class="hist-icon">' + icon + '</span>' +
                         '<div class="hist-main">' +
                           '<div class="hist-line"><b title="' + EB.escapeHtml((j.ts || '').replace('T', ' ')) + '">' +
                               EB.escapeHtml(EB.relTime(j.ts) || j.job_id) + '</b>' +
                               (j.user ? ' <span class="dim">· ' + EB.escapeHtml(j.user) + '</span>' : '') + '</div>' +
                           (detail ? '<div class="hist-detail" title="' + EB.escapeHtml(detail) + '">' + EB.escapeHtml(detail) + '</div>' : '') +
                           '<div class="hist-id">' + EB.escapeHtml(j.job_id) + '</div>' +
                         '</div>' +
                         (j.has_log ? '<button class="tool-btn" data-job="' + EB.escapeHtml(j.job_id) + '">log</button>' : '') +
                       '</div>';
            }).join('');
        }

        function renderSessions(sessions) {
            if (!sessions.length) { $('side-sessions').innerHTML = '<div class="side-empty">Sin sesiones</div>'; return; }
            $('side-sessions').innerHTML = sessions.map(function(s) {
                // El nombre output_<session_id>.log es el INICIO de la sesión (en logs
                // viejos, output_<ts>.log era la hora de rotación). El fin es el mtime:
                // la última línea escrita.
                var iso = EB.isoLocal(s.mtime);
                var start = EB.sessionStart(s.name);
                var title = (start ? 'desde ' + start.replace('T', ' ') + ' · ' : '') + 'hasta ' + iso.replace('T', ' ');
                return '<div class="hist-item' + (s.current ? ' hist-current' : '') + '">' +
                         '<span class="hist-icon">' + (s.current ? '●' : '▤') + '</span>' +
                         '<div class="hist-main">' +
                           '<div class="hist-line"><b title="' + title + '">' + (s.current ? 'Sesión actual' : 'hasta ' + EB.escapeHtml(EB.relTime(iso))) + '</b>' +
                             ' <span class="dim">· ' + EB.fmtBytes(s.size) + '</span></div>' +
                           '<div class="hist-id">' + EB.escapeHtml(s.name) + '</div>' +
                         '</div>' +
                         (s.current ? '' : '<button class="tool-btn" data-session="' + EB.escapeHtml(s.name) + '">ver</button>') +
                         '<a class="tool-btn" href="' + api + '/sessions/' + encodeURIComponent(s.name) + '?download=1">⤓</a>' +
                       '</div>';
            }).join('');
        }


        // ── Eventos (/api/board/{key}/events) ────────────────────────────────
        var EV_PAGE = 100, EV_MAX = 1000;
        var evLimit = EV_PAGE;
        var evFilter = {};          // tipos elegidos en los chips (vacío = todos)
        var evCounts = [];          // por tipo, de la última carga sin filtro
        var evData = null;

        function getJson(url) {
            return fetch(url).then(function(r) {
                return r.json().catch(function() { return null; })
                        .then(function(d) { return {ok: r.ok, status: r.status, body: d}; });
            });
        }

        function loadEvents() {
            if (!boardApi) {
                $('side-events').innerHTML = '<div class="side-empty">' +
                    (deviceLoaded ? 'La placa todavía no tiene MAC: sin eventos' : 'Cargando…') + '</div>';
                return;
            }
            var types = Object.keys(evFilter);
            getJson(boardApi + '/events?limit=' + evLimit + (types.length ? '&type=' + types.join(',') : ''))
                .then(function(res) {
                    if (!res.ok) throw new Error(EB.errorText(res.body, res.status));
                    evData = res.body;
                    curSession = evData.session || curSession;
                    if (!types.length) evCounts = EB.eventCounts(evData.events);
                    renderEvents();
                })
                .catch(function(e) { $('side-events').innerHTML = '<div class="side-empty">Error al leer los eventos: ' + EB.escapeHtml(e.message) + '</div>'; });
        }

        function renderEvents() {
            var evs = evData.events;
            var active = Object.keys(evFilter).length > 0;
            var chips = evCounts.map(function(c) {
                return '<button class="ev-chip ev-' + c.type.replace(/_/g, '-') + (evFilter[c.type] ? ' active' : '') +
                       '" data-type="' + c.type + '" title="' + c.n + ' en los últimos eventos cargados">' +
                       c.icon + ' ' + EB.escapeHtml(c.label) + ' <b>' + c.n + '</b></button>';
            }).join('') + (active ? '<button class="ev-chip ev-all" data-type="">✕ todos</button>' : '');
            var rows = [];
            var prevSess = null;
            for (var i = evs.length - 1; i >= 0; i--) {     // más nuevo arriba
                var v = EB.eventView(evs[i]);
                if (v.session && v.session !== prevSess) {
                    rows.push('<div class="ev-sess">' + (v.session === curSession ? '● sesión actual' : '▤ sesión') +
                              ' <span class="dim">desde ' + EB.sessionLabel(v.session) + '</span></div>');
                    prevSess = v.session;
                }
                rows.push('<div class="ev-item ' + v.cls + (v.bad ? ' ev-bad' : '') + (v.cursor ? '' : ' ev-nocursor') +
                          '" data-i="' + i + '" title="' + EB.escapeHtml(v.title) + '">' +
                            '<span class="ev-icon">' + v.icon + '</span>' +
                            '<span class="ev-time">' + v.time + '</span>' +
                            '<span class="ev-main"><span class="ev-label">' + EB.escapeHtml(v.label) + '</span> ' +
                              '<span class="ev-detail">' + EB.escapeHtml(v.detail) + '</span></span>' +
                            (v.who ? '<span class="ev-who">' + EB.escapeHtml(v.who) + '</span>' : '') +
                          '</div>');
            }
            var more = '';
            if (evData.more && evLimit < EV_MAX) more = '<button class="tool-btn ev-more" id="ev-more">cargar más</button>';
            else if (evData.more) more = '<div class="side-empty">Hay más: <code>espbench events --since</code></div>';
            $('side-events').innerHTML = (chips ? '<div class="ev-chips">' + chips + '</div>' : '') +
                (rows.length ? rows.join('') : '<div class="side-empty">Sin eventos' + (active ? ' de ese tipo' : '') + '</div>') + more;
        }

        $('side-events').addEventListener('click', function(e) {
            var chip = e.target.closest('.ev-chip');
            if (chip) {
                var t = chip.dataset.type;
                if (!t) evFilter = {};
                else if (evFilter[t]) delete evFilter[t];
                else evFilter[t] = true;
                evLimit = EV_PAGE;
                loadEvents();
                return;
            }
            if (e.target.id === 'ev-more') { evLimit = Math.min(EV_MAX, evLimit + EV_PAGE); loadEvents(); return; }
            var row = e.target.closest('.ev-item');
            if (row && evData) openEventViewer(evData.events[+row.dataset.i]);
        });

        // ── Visor (log de un job, una sesión anterior o un evento en contexto) ─
        function showViewer(title, downloadUrl) {
            $('viewer-title').textContent = title;
            $('viewer-body').innerHTML = '<div class="side-empty">Cargando…</div>';
            $('viewer-download').href = downloadUrl;
            $('viewer').classList.remove('hidden');
        }

        // Líneas completas → DOM del visor (sin el filtro de la vista en vivo). Devuelve los elementos.
        function renderViewer(lines) {
            var frag = document.createDocumentFragment();
            var els = lines.map(function(l) { var el = makeLine(l, null, true); frag.appendChild(el); return el; });
            $('viewer-body').innerHTML = '';
            $('viewer-body').appendChild(frag);
            return els;
        }

        function viewerError(msg) {
            $('viewer-body').innerHTML = '<div class="side-empty">Error: ' + EB.escapeHtml(msg) + '</div>';
        }

        function openViewer(title, url, downloadUrl) {
            showViewer(title, downloadUrl || url);
            fetch(url).then(function(r) { if (!r.ok) throw new Error(r.status); return r.text(); })
                .then(function(text) { renderViewer(new EB.LineBuffer().push(text + '\n')); })
                .catch(function(e) { viewerError(e.message); });
        }

        /*
         * Evento en contexto: /log?around=<cursor> (EB.eventContext) y, aparte,
         * la línea exacta del evento (around con before=after=0) para resaltarla.
         * El cursor lleva la sesión: sirve para sesiones anteriores.
         */
        function openEventViewer(ev) {
            var v = EB.eventView(ev);
            var ctx = EB.eventContext(ev);
            if (!ctx) { toast('Ese evento no tiene cursor en el log', true); return; }
            var other = v.session && v.session !== curSession;
            showViewer(v.icon + ' ' + v.label + (v.detail ? ' ' + v.detail : '') + ' · ' + (ev.ts || '').replace('T', ' ').slice(0, 19) +
                       (other ? ' · sesión del ' + EB.sessionLabel(v.session) : ''),
                       api + '/sessions/' + encodeURIComponent(EB.sessionFile(v.session, curSession)) + '?download=1');
            var center = {around: ev.cursor, before: '0', after: '0', raw: '1', max_lines: '1'};
            Promise.all([getJson(boardApi + '/log?' + new URLSearchParams(ctx)),
                         getJson(boardApi + '/log?' + new URLSearchParams(center))])
                .then(function(res) {
                    var a = res[0], b = res[1];
                    if (!a.ok) { viewerError(EB.errorText(a.body, a.status)); return; }
                    var raw = a.body.lines.map(function(l) { return l.replace(/\r+$/, ''); });
                    var els = renderViewer(raw.map(function(l) { return EB.overwrite(EB.expandRangeLine(l, a.body.date)); }));
                    var target = b.ok && b.body.lines.length ? b.body.lines[0].replace(/\r+$/, '') : null;
                    var i = EB.findLine(raw, target, a.body.date, b.ok ? b.body.date : null);
                    var el;
                    if (i >= 0) {
                        el = els[i];
                    } else {
                        // Evento del api al final del log (sin línea después todavía)
                        el = document.createElement('div');
                        el.className = 'ln ln-note';
                        el.textContent = '▸ el evento quedó acá (todavía no hay una línea después)';
                        $('viewer-body').appendChild(el);
                    }
                    el.classList.add('ln-target');
                    markEvent(el, ev);
                    el.scrollIntoView({block: 'center'});
                })
                .catch(function(e) { viewerError(e.message); });
        }

        function closeViewer() { $('viewer').classList.add('hidden'); }

        // ── Entrada serie ────────────────────────────────────────────────────
        var sent = [];
        var sentIdx = -1;

        // POST con JSON → [ok, status, body], con el par recordado (si es el dueño
        // de la reserva, pasa; si no, el evento queda con su usuario). Ante 423
        // (reservada por otro) muestra quién y hasta cuándo, y reintenta con force.
        function postJson(path, body, action) {
            var pair = getPair();
            var full = Object.assign(pair ? {lock_user: pair.user, lock_token: pair.token} : {}, body || {});
            return postWrite(path, full).then(function(res) {
                if (res[1] !== 423 || full.force) return res;
                return Promise.resolve(loadDeviceInfo()).then(function() {
                    var msg = EB.forceConfirmText(currentLock, action || 'Mandar', EB.errorText(res[2], res[1]));
                    if (!confirm(msg)) return res;
                    return postJson(path, Object.assign({}, body, {force: true}), action);
                });
            });
        }

        function sendSerial(e) {
            e.preventDefault();
            var input = $('serial-text');
            var text = input.value;
            var enter = $('serial-enter').checked;
            if (!text && !enter) return;
            postJson('/send', {text: text, enter: enter})
              .then(function(res) {
                  if (!res[0]) { toast(EB.errorText(res[2], res[1]), true); return; }
                  if (text && sent[sent.length - 1] !== text) sent.push(text);
                  sentIdx = -1;
                  input.value = '';
                  setFollow(true);
              })
              .catch(function() { toast('Error de conexión', true); });
        }

        $('serial-text').addEventListener('keydown', function(e) {
            if (e.key !== 'ArrowUp' && e.key !== 'ArrowDown') return;
            if (!sent.length) return;
            e.preventDefault();
            if (e.key === 'ArrowUp') sentIdx = sentIdx < 0 ? sent.length - 1 : Math.max(0, sentIdx - 1);
            else sentIdx = sentIdx < 0 ? -1 : sentIdx + 1;
            if (sentIdx >= sent.length) sentIdx = -1;
            this.value = sentIdx < 0 ? '' : sent[sentIdx];
        });

        var toastTimer = null;
        function toast(msg, error) {
            var t = $('toast');
            t.textContent = msg;
            t.className = 'toast' + (error ? ' toast-error' : '');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(function() { t.classList.add('hidden'); }, 3500);
        }

        // ── Comandos del monitor ─────────────────────────────────────────────
        function sendCommand(cmd) {
            var btn = $('btn-' + cmd);
            btn.disabled = true;
            postJson('/command/' + cmd, {}, cmd === 'reset' ? 'Resetear' : 'Pasar a bootloader')
                .then(function(res) { if (!res[0]) toast(EB.errorText(res[2], res[1]), true); })
                .catch(function() { toast('Error de conexión', true); })
                .finally(function() { setTimeout(function() { btn.disabled = false; }, 1000); });
        }

        // ── Init ──────────────────────────────────────────────────────────────
        if (!tty) {
            terminal.textContent = 'Error: parámetro ?tty= faltante.';
        } else {
            document.title = 'espbench — ' + tty;
            $('device-name').textContent = tty;
            $('btn-download').href = api + '/sessions/output.log?download=1';

            connect();
            loadDeviceInfo();
            setInterval(loadDeviceInfo, 3000);
            setInterval(loadHistory, 10000);
            setInterval(pollMarks, 4000);

            $('btn-reset').onclick = function() { sendCommand('reset'); };
            $('btn-bootloader').onclick = function() { sendCommand('bootloader'); };
            $('btn-devremote-reset').onclick = function() {
                if (!confirm('¿Reiniciar la sesión de ' + tty + '? Mata y relanza el proceso del device.')) return;
                var btn = $('btn-devremote-reset');
                btn.disabled = true;
                // postJson: ante una reserva ajena (423) pregunta y reintenta con force
                postJson('/devremote-reset', {}, 'Reiniciar la sesión')
                    .then(function(res) {
                        var d = res[2] || {};
                        if (!res[0]) { toast(EB.errorText(d, res[1]), true); return; }
                        toast(d.ok ? 'Sesión reiniciada' : 'Falló: ' + (d.stderr || ''), !d.ok);
                    })
                    .catch(function() { toast('Error de conexión', true); })
                    .finally(function() { setTimeout(function() { btn.disabled = false; }, 4000); });
            };
            fetch('/api/version').then(function(r) { return r.json(); })
                .then(function(v) { apiAuth = !!v.auth; $('btn-force').classList.toggle('hidden', !currentLock || !apiAuth); })
                .catch(function() {});
            $('btn-release').onclick = onRelease;
            $('btn-force').onclick = onForce;
            setInterval(tickLocks, 1000);

            $('filter').addEventListener('input', function() { filterText = this.value.trim().toLowerCase(); refilter(); });
            $('btn-problems').onclick = function() {
                onlyProblems = !onlyProblems;
                this.classList.toggle('active', onlyProblems);
                refilter();
            };
            $('btn-panic').onclick = jumpToPanic;
            function applyTs() {
                document.body.classList.toggle('hide-ts', !showTs);
                $('btn-ts').classList.toggle('active', showTs);
            }
            $('btn-ts').onclick = function() {
                showTs = !showTs;
                try { localStorage.setItem('eb.showTs', showTs ? '1' : '0'); } catch (e) {}
                applyTs();
            };
            applyTs();
            $('btn-follow').onclick = function() { setFollow(!follow); };
            $('new-lines').onclick = function() { setFollow(true); };
            $('btn-clear').onclick = clearView;
            $('btn-history').onclick = function() { toggleHistory(!panelOpen()); };
            $('side-close').onclick = function() { toggleHistory(false); };
            Array.prototype.forEach.call(document.querySelectorAll('.side-tab'), function(tab) {
                tab.onclick = function() {
                    sideTab = tab.dataset.tab;
                    document.querySelectorAll('.side-tab').forEach(function(t) { t.classList.toggle('active', t === tab); });
                    $('side-events').classList.toggle('hidden', sideTab !== 'events');
                    $('side-jobs').classList.toggle('hidden', sideTab !== 'jobs');
                    $('side-sessions').classList.toggle('hidden', sideTab !== 'sessions');
                    loadHistory();
                };
            });
            $('side-panel').addEventListener('click', function(e) {
                var b = e.target.closest('button[data-job], button[data-session]');
                if (!b) return;
                if (b.dataset.job) {
                    var url = api + '/jobs/' + encodeURIComponent(b.dataset.job) + '/log';
                    openViewer('Flasheo ' + b.dataset.job, url, url);
                } else {
                    var surl = api + '/sessions/' + encodeURIComponent(b.dataset.session);
                    openViewer('Sesión ' + b.dataset.session, surl, surl + '?download=1');
                }
            });
            $('viewer-close').onclick = closeViewer;
            $('viewer').addEventListener('click', function(e) { if (e.target === this) closeViewer(); });
            $('serial-form').addEventListener('submit', sendSerial);

            document.addEventListener('keydown', function(e) {
                var typing = document.activeElement && document.activeElement.tagName === 'INPUT';
                if (e.key === 'Escape') {
                    if (!$('viewer').classList.contains('hidden')) closeViewer();
                    else if (document.activeElement === $('filter')) { $('filter').value = ''; filterText = ''; refilter(); $('filter').blur(); }
                }
                if (typing) return;
                if (e.key === '/') { e.preventDefault(); $('filter').focus(); }
                if (e.key === 'End') { e.preventDefault(); setFollow(true); }
                if (e.key === 'i') { e.preventDefault(); $('serial-text').focus(); }
            });
        }

        function setStatus(state) {
            $('status-dot').className = 'status-dot ' + state;
            var labels = {connected: 'en vivo', reconnecting: 'reconectando...', error: 'error'};
            $('status-label').textContent = labels[state] || state;
        }

        function connect() {
            if (ws) { ws.onclose = null; ws.close(); }
            setStatus('reconnecting');
            var wsProto = location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(wsProto + '//' + location.host + '/ws/device/' + encodeURIComponent(tty));
            ws.onopen = function() {
                setStatus('connected');
                if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
                // El server manda la sesión completa al conectar: empezar de cero
                // para no duplicar lo que ya estaba en la vista.
                clearView();
                buffer = new EB.LineBuffer();
                marks.reset();
                setTimeout(pollMarks, 1500);
            };
            ws.onmessage = function(evt) { appendText(evt.data); };
            ws.onclose   = function() {
                setStatus('reconnecting');
                reconnectTimer = setTimeout(connect, 2000);
            };
            ws.onerror   = function() { setStatus('error'); ws.close(); };
        }
    </script>
</body>
</html>
