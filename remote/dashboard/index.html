<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>espbench</title>
    <link rel="stylesheet" href="/style.css">
    <script src="/espbench.js"></script>
</head>
<body>
    <header class="home-header">
        <div class="header-card">
            <div class="header-brand">
                <span class="header-icon">⚡</span>
                <span class="header-title">espbench</span>
            </div>
            <div class="header-summary" id="summary"></div>
            <div class="header-meta">
                <input id="search" class="search-input" type="search" placeholder="Buscar…  ( / )" autocomplete="off">
                <span id="version-badge" class="version-badge"></span>
                <span class="author-tag">by AlejoGm</span>
            </div>
        </div>
    </header>

    <main>
        <div id="cards-known" class="cards-grid"></div>
        <div id="cards-unknown-wrap" class="hidden">
            <div class="section-label">Sin identificar</div>
            <div id="cards-unknown" class="cards-grid"></div>
        </div>
        <div id="empty-state" class="empty-state hidden">No hay dispositivos conectados</div>
    </main>

    <script>
        function formatTimestamp(iso) {
            if (!iso) return 'Nunca';
            return iso.replace('T', ' ');
        }

        var escapeHtml = EB.escapeHtml;

        function row(label, value, extra) {
            return '<div class="card-row"><span class="card-label">' + label + '</span>' +
                   '<span class="card-value"' + (extra || '') + '>' + value + '</span></div>';
        }

        function healthHtml(device) {
            var b = EB.healthBadges(device.health);
            if (!b.length) return '';
            return '<div class="health-row">' + b.map(function(x) {
                return '<span class="hbadge ' + x.cls + '" title="' + escapeHtml(x.title) + '">' + escapeHtml(x.text) + '</span>';
            }).join('') + '</div>';
        }

        // "app v1.2.3 · IDF v5.3.2", con lo que haya.
        function firmwareText(device) {
            var parts = [];
            if (device.fw_project) parts.push(escapeHtml(device.fw_project));
            if (device.fw_version) parts.push('<span class="fw-version nowrap">' + escapeHtml(device.fw_version) + '</span>');
            var main = parts.join(' ');
            if (device.fw_idf) main += (main ? ' <span class="dim">·</span> ' : '') + '<span class="dim nowrap">IDF ' + escapeHtml(device.fw_idf) + '</span>';
            return main;
        }

        function lastFlashHtml(device) {
            if (!device.last_flash_ts) return '<span class="dim">nunca</span>';
            var icon = device.last_flash_ok === true ? '<span class="ok-mark">✓</span> '
                     : device.last_flash_ok === false ? '<span class="fail-mark">✗</span> ' : '';
            var who = device.last_flash_user ? ' <span class="dim">·</span> ' + escapeHtml(device.last_flash_user) : '';
            return icon + escapeHtml(EB.relTime(device.last_flash_ts) || device.last_flash_ts) + who;
        }

        // Clases de la card según estado de la FSM y salud: la franja de color de la izquierda.
        function cardStateClass(device) {
            if (device.status !== 'RUNNING') return ' st-down';
            if (device.state === 'flashing' || device.state === 'erasing') return ' st-busy';
            if (device.state === 'discovering') return ' st-busy';
            if (device.state === 'unknown') return ' st-unknown';
            var lvl = EB.healthLevel(device.health);
            return lvl === 'bad' ? ' st-bad' : lvl === 'warn' ? ' st-warn' : ' st-ok';
        }

        // Estado de la FSM del device (run/<tty>.json). "monitoring" es lo normal
        // y no lleva badge; el resto sí, para ver de un vistazo qué está pasando.
        var STATE_BADGES = {
            discovering: ['badge-busy',    'INICIANDO'],
            flashing:    ['badge-busy',    'FLASHEANDO'],
            erasing:     ['badge-busy',    'BORRANDO'],
            unknown:     ['badge-unknown', 'SIN MAC'],
            disconnected:['badge-down',    'DESCONECTADO']
        };

        function stateBadge(device) {
            var b = STATE_BADGES[device.state];
            return b ? '<span class="badge ' + b[0] + '">' + b[1] + '</span>' : '';
        }

        var _renamingTty = null;

        function buildCard(device) {
            var statusClass = device.status === 'RUNNING' ? 'badge-running' : 'badge-down';
            var lastFlash = formatTimestamp(device.last_flash_ts);
            var title = device.device_key || device.tty_name;
            var tty = escapeHtml(device.tty_name);

            var card = document.createElement('div');
            card.className = 'device-card' + cardStateClass(device) + (device.lock_user ? ' locked' : '');
            card.dataset.search = [title, device.tty_name, device.sn, device.mac, device.hw_model,
                                   device.fw_project, device.fw_version, device.last_flash_user, device.lock_user]
                                  .filter(Boolean).join(' ').toLowerCase();

            var fw = firmwareText(device);
            var hwModelRow = device.hw_model ? row('HW', escapeHtml(device.hw_model)) : '';
            var fwRow = fw ? row('Firmware', fw) : '';
            var snRow = device.sn ? row('SN', escapeHtml(device.sn)) : '';
            var ttyRow = row('Puerto', escapeHtml(device.tty_name) + ' <span class="dim">· tcp ' + escapeHtml(String(device.port_tcp)) + '</span>');

            var renameHtml = device.mac
                ? '<button class="rename-btn" id="rename-btn-' + tty + '" title="Renombrar">✎</button>' +
                  '<input class="rename-input hidden" id="rename-input-' + tty + '" value="' + escapeHtml(title) + '" />' +
                  '<button class="rename-ok hidden" id="rename-ok-' + tty + '" title="Confirmar">✓</button>' +
                  '<button class="rename-cancel hidden" id="rename-cancel-' + tty + '" title="Cancelar">✗</button>'
                : '';

            card.innerHTML =
                '<div class="card-header">' +
                    '<div class="card-title-wrap">' +
                        '<span class="card-title" id="key-label-' + tty + '">' + escapeHtml(title) + '</span>' +
                        renameHtml +
                    '</div>' +
                    '<div class="card-header-badges">' +
                        (device.lock_user ? '<span class="badge badge-locked">&#128274; ' + escapeHtml(device.lock_user) + '</span>' : '') +
                        stateBadge(device) +
                        '<span class="badge ' + statusClass + '">' + escapeHtml(device.status) + '</span>' +
                    '</div>' +
                '</div>' +
                healthHtml(device) +
                '<div class="card-body">' +
                    hwModelRow + fwRow +
                    row('Último flash', lastFlashHtml(device), ' title="' + escapeHtml(lastFlash) + '"') +
                    snRow + ttyRow +
                '</div>' +
                '<div class="card-footer">' +
                    '<a class="btn-monitor" href="/device.html?tty=' + encodeURIComponent(device.tty_name) + '">Ver monitor</a>' +
                    '<button class="btn-copy" id="copy-btn-' + tty + '">⎘ Config</button>' +
                '</div>';

            card.querySelector('.btn-copy').addEventListener('click', function() {
                copyConfig(device);
            });

            if (device.mac) {
                var ttyName = device.tty_name;
                var mac = device.mac;
                card.querySelector('.rename-btn').addEventListener('click', function() {
                    startRename(ttyName, mac, title);
                });
                card.querySelector('.rename-ok').addEventListener('click', function() {
                    submitRename(ttyName, mac);
                });
                card.querySelector('.rename-cancel').addEventListener('click', function() {
                    cancelRename(ttyName);
                });
            }

            return card;
        }

        function startRename(ttyName, mac, currentKey) {
            _renamingTty = ttyName;
            var label  = document.getElementById('key-label-'    + ttyName);
            var btn    = document.getElementById('rename-btn-'   + ttyName);
            var inp    = document.getElementById('rename-input-' + ttyName);
            var ok     = document.getElementById('rename-ok-'    + ttyName);
            var cancel = document.getElementById('rename-cancel-' + ttyName);
            if (!inp) return;

            label.classList.add('hidden');
            btn.classList.add('hidden');
            inp.classList.remove('hidden');
            ok.classList.remove('hidden');
            cancel.classList.remove('hidden');

            inp.value = currentKey;
            inp.focus();
            inp.select();
            inp.onkeydown = function(e) {
                if (e.key === 'Enter')  submitRename(ttyName, mac);
                if (e.key === 'Escape') cancelRename(ttyName);
            };
        }

        function cancelRename(ttyName) {
            _renamingTty = null;
            var label  = document.getElementById('key-label-'     + ttyName);
            var btn    = document.getElementById('rename-btn-'    + ttyName);
            var inp    = document.getElementById('rename-input-'  + ttyName);
            var ok     = document.getElementById('rename-ok-'     + ttyName);
            var cancel = document.getElementById('rename-cancel-' + ttyName);
            if (!inp) return;

            inp.classList.add('hidden');
            ok.classList.add('hidden');
            cancel.classList.add('hidden');
            label.classList.remove('hidden');
            btn.classList.remove('hidden');
        }

        function submitRename(ttyName, mac) {
            var inp = document.getElementById('rename-input-' + ttyName);
            if (!inp) return;
            var newKey = inp.value.trim();
            if (!newKey) return;

            fetch('/api/devices/' + mac, {
                method: 'PATCH',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({device_key: newKey})
            }).then(function(r) { return r.json(); })
              .then(function(d) {
                  _renamingTty = null;
                  if (d.ok) {
                      fetchDevices();
                  } else {
                      alert('Error al renombrar: ' + (d.detail || JSON.stringify(d)));
                  }
              })
              .catch(function() { _renamingTty = null; alert('Error de conexión'); });
        }

        function copyConfig(device) {
            var snippet = {
                name: device.device_key || device.tty_name,
                host: window.location.hostname,
                token: "",
                lock_user: "",
                lock_token: ""
            };
            var text = JSON.stringify(snippet, null, 2);
            var btn = document.getElementById('copy-btn-' + device.tty_name);
            function feedback() {
                if (!btn) return;
                var orig = btn.textContent;
                btn.textContent = '✓ Copiado';
                btn.classList.add('btn-copy-done');
                setTimeout(function() {
                    btn.textContent = orig;
                    btn.classList.remove('btn-copy-done');
                }, 1800);
            }
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(feedback).catch(function() {
                    fallbackCopy(text); feedback();
                });
            } else {
                fallbackCopy(text); feedback();
            }
        }

        function fallbackCopy(text) {
            var ta = document.createElement('textarea');
            ta.value = text;
            ta.style.position = 'fixed';
            ta.style.opacity = '0';
            document.body.appendChild(ta);
            ta.focus(); ta.select();
            try { document.execCommand('copy'); } catch(e) {}
            document.body.removeChild(ta);
        }

        function buildUnknownCard(device) {
            var statusClass = device.status === 'RUNNING' ? 'badge-running' : 'badge-down';
            var tty = escapeHtml(device.tty_name);

            var card = document.createElement('div');
            card.className = 'device-card card-unknown' + cardStateClass(device);
            card.dataset.search = device.tty_name.toLowerCase();

            var snRow = device.sn ? row('SN', escapeHtml(device.sn)) : '';

            card.innerHTML =
                '<div class="card-header">' +
                    '<div class="card-title-wrap">' +
                        '<span class="card-title card-title-dim">' + escapeHtml(device.tty_name) + '</span>' +
                    '</div>' +
                    '<div class="card-header-badges">' +
                        stateBadge(device) +
                        '<span class="badge ' + statusClass + '">' + escapeHtml(device.status) + '</span>' +
                    '</div>' +
                '</div>' +
                healthHtml(device) +
                '<div class="card-body">' +
                    snRow + row('Puerto TCP', escapeHtml(String(device.port_tcp))) +
                '</div>' +
                '<div class="card-footer">' +
                    '<a class="btn-monitor" href="/device.html?tty=' + encodeURIComponent(device.tty_name) + '">Ver monitor</a>' +
                '</div>';

            return card;
        }

        function renderDevices(devices) {
            if (_renamingTty !== null) return;
            var known       = document.getElementById('cards-known');
            var unknown     = document.getElementById('cards-unknown');
            var unknownWrap = document.getElementById('cards-unknown-wrap');
            var emptyState  = document.getElementById('empty-state');

            known.innerHTML   = '';
            unknown.innerHTML = '';

            if (!devices || devices.length === 0) {
                emptyState.classList.remove('hidden');
                unknownWrap.classList.add('hidden');
                return;
            }
            emptyState.classList.add('hidden');

            var hasUnknown = false;
            devices.forEach(function(device) {
                if (device.mac) {
                    known.appendChild(buildCard(device));
                } else {
                    unknown.appendChild(buildUnknownCard(device));
                    hasUnknown = true;
                }
            });
            unknownWrap.classList.toggle('hidden', !hasUnknown);
            applySearch();
        }

        // Contadores del header: de un vistazo, cuántos andan y cuántos tienen problemas.
        function renderSummary(devices) {
            var c = {total: devices.length, ok: 0, busy: 0, bad: 0, down: 0, locked: 0};
            devices.forEach(function(d) {
                var cls = cardStateClass(d);
                if (cls === ' st-down') c.down++;
                else if (cls === ' st-busy') c.busy++;
                else if (cls === ' st-bad' || cls === ' st-warn') c.bad++;
                else if (cls === ' st-unknown') return;
                else c.ok++;
                if (d.lock_user) c.locked++;
            });
            function chip(n, cls, label, title) {
                return n ? '<span class="sum-chip ' + cls + '" title="' + title + '"><b>' + n + '</b> ' + label + '</span>' : '';
            }
            document.getElementById('summary').innerHTML =
                chip(c.total, 'sum-total', c.total === 1 ? 'device' : 'devices', 'Devices conectados') +
                chip(c.ok, 'sum-ok', 'ok', 'Monitoreando, sin problemas') +
                chip(c.busy, 'sum-busy', 'ocupados', 'Flasheando, borrando o iniciando') +
                chip(c.bad, 'sum-bad', 'con problemas', 'Panic, boot loop o reset anormal desde el último flash') +
                chip(c.down, 'sum-down', 'caídos', 'Sin proceso vivo') +
                chip(c.locked, 'sum-locked', 'bloqueados', 'Con lock de usuario');
        }

        function applySearch() {
            var q = document.getElementById('search').value.trim().toLowerCase();
            document.querySelectorAll('.device-card').forEach(function(card) {
                card.classList.toggle('hidden', !!q && card.dataset.search.indexOf(q) < 0);
            });
        }

        document.getElementById('search').addEventListener('input', applySearch);
        document.addEventListener('keydown', function(e) {
            var search = document.getElementById('search');
            if (e.key === '/' && document.activeElement !== search && document.activeElement.tagName !== 'INPUT') {
                e.preventDefault();
                search.focus();
            }
            if (e.key === 'Escape' && document.activeElement === search) { search.value = ''; applySearch(); search.blur(); }
        });

        function fetchDevices() {
            fetch('/api/devices')
                .then(function(r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
                .then(function(devices) { renderSummary(devices || []); renderDevices(devices); })
                .catch(function(err) { console.error('Error:', err); });
        }

        fetch('/api/version')
            .then(function(r) { return r.json(); })
            .then(function(d) {
                var el = document.getElementById('version-badge');
                if (el && d.version) el.textContent = 'v' + d.version;
            })
            .catch(function() {});

        fetchDevices();
        setInterval(fetchDevices, 5000);
    </script>
</body>
</html>
