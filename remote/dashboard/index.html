<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>espbench</title>
    <script src="theme.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
    <link rel="stylesheet" href="style.css">
    <script src="espbench.js"></script>
    <script src="auth.js"></script>
    <script src="meta.js"></script>
</head>
<body>
<div class="page">
    <header class="topbar">
        <h1>espbench</h1>
        <label class="search"><i class="ti ti-search" aria-hidden="true"></i>
            <input id="search" type="search" placeholder="Buscar placa, SN, nota, @usuario o chip:esp32-s3" autocomplete="off"><kbd>/</kbd></label>
        <button class="pill icon" data-theme-toggle aria-label="Cambiar tema"><i class="ti ti-moon"></i></button>
    </header>

    <section class="card bench-head">
        <div class="bench-id">
            <div class="av"><i class="ti ti-server-2" aria-hidden="true"></i></div>
            <div><h2 id="bench-name">…</h2>
                <div class="sub"><button class="bench-loc empty hidden" id="bench-loc"></button><span id="bench-sub"></span></div>
                <div class="meta-editor" id="loc-editor"></div></div>
        </div>
        <div class="mchips" id="bench-chips"></div>
        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px">
            <button class="pill accent" id="btn-update"><i class="ti ti-download" aria-hidden="true"></i>Actualizar</button>
            <span class="upd-state" id="upd-state"></span>
        </div>
    </section>

    <div class="section-h">
        <h2>Placas</h2>
        <div class="tabs" id="tabs"></div>
        <label class="group-sel" title="Agrupar las placas"><i class="ti ti-layout-rows" aria-hidden="true"></i>Agrupar
            <select id="group" aria-label="Agrupar las placas"></select></label>
        <div class="legend"><span><i style="background:var(--boot)"></i>Reinicio</span><span><i style="background:var(--bad)"></i>Panic</span><span><i style="background:var(--flash)"></i>Flash</span><span><i style="background:var(--warn)"></i>Reservada</span></div>
    </div>
    <section class="boards" id="boards"></section>
    <div class="empty hidden" id="empty"><b>No hay placas conectadas</b>Enchufá un ESP32 al bench: aparece solo.</div>
</div>

<script>
    var esc = EB.escapeHtml;
    var devices = [], activity = {}, filter = 'all', renaming = null, location_ = null;

    // Agrupar (EB.groupBoards): ?group= gana a la recordada (localStorage por página: a través de bench-master
    // todos los benches comparten origen con el master, que tiene sus propias opciones).
    var GROUP_KEY = 'eb.group.bench';
    var groupBy = (function() {
        var stored = null;
        try { stored = localStorage.getItem(GROUP_KEY); } catch (e) {}
        return EB.pickGroup(new URLSearchParams(location.search).get('group'), stored, false);
    })();
    document.getElementById('group').innerHTML = EB.groupOptions(false).map(function(o) {
        return '<option value="' + o[0] + '"' + (o[0] === groupBy ? ' selected' : '') + '>' + esc(o[1]) + '</option>';
    }).join('');
    document.getElementById('group').addEventListener('change', function() {
        groupBy = this.value;
        try { localStorage.setItem(GROUP_KEY, groupBy); } catch (e) {}
        var u = new URL(location.href);
        if (groupBy) u.searchParams.set('group', groupBy); else u.searchParams.delete('group');
        history.replaceState(null, '', u.pathname + u.search + u.hash);
        render();
    });

    var TABS = [
        ['all', 'Todas', function() { return true; }],
        ['problems', 'Con problemas', function(d) { var c = EB.boardStatus(d).cls; return c === 'bad' || c === 'warn' || c === 'off'; }],
        ['reserved', 'Reservadas', function(d) { var l = EB.lockInfo(d); return !!(l && l.reservation); }],
        // estado no-tocar / roto (EB.avoided): sana pero no se elige. La pestaña aparece si hay alguna.
        ['avoid', 'No tocar / rotas', function(d) { return EB.boardStatus(d, undefined, EBMeta.catalog()).cls === 'avoid'; }]
    ];

    function getJson(url) {
        return fetch(url).then(function(r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); });
    }

    // ── cabecera del bench ──

    function renderHealth(h) {
        document.getElementById('bench-chips').innerHTML = EB.benchChips(h).map(function(c) {
            return '<span class="mchip ' + c.level + '" title="' + esc(c.label) + '"><i class="ti ti-' + c.icon + '" aria-hidden="true"></i><b>' +
                   esc(c.value) + '</b> ' + esc(c.label) + '</span>';
        }).join('') + '<span id="pin-chip"></span>';
        renderPin();
    }

    var update = null;
    function renderPin() {
        var el = document.getElementById('pin-chip');
        if (el) el.outerHTML = update && update.pin ? '<span class="mchip pin" id="pin-chip" title="Fijo en esta rama: el update automático no lo toca"><i class="ti ti-pin" aria-hidden="true"></i>' + esc(update.pin) + '</span>'
                                                  : '<span id="pin-chip"></span>';
        var st = update && update.status, s = document.getElementById('upd-state');
        s.className = 'upd-state';
        if (!st) { s.textContent = ''; return; }
        if (st.state === 'running') s.textContent = 'Actualizando…';
        else if (st.state === 'rolled_back' || st.state === 'failed') { s.textContent = st.state === 'failed' ? 'El último update falló' : 'El último update volvió atrás'; s.className += ' bad'; s.title = st.message || ''; }
        else s.textContent = '';
    }

    function loadBench() {
        getJson('api/version').then(function(v) {
            document.getElementById('bench-name').textContent = v.name || 'bench';
            document.getElementById('bench-sub').textContent = 'Versión ' + v.version;
            document.title = (v.name || 'espbench') + ' · espbench';
            // Bench sin `location` en /api/version (anterior a 0.41): sin el botón.
            if ('location' in v && !EBMeta.editing()) renderLocation(v.location);
        }).catch(function() {});
        getJson('api/bench/health').then(renderHealth).catch(function() {});
        getJson('api/update').then(function(u) { update = u; renderPin(); }).catch(function() {});
    }

    // Ubicación del bench (automática por IP, o fijada a mano): el ícono dice cuál; click → override manual.
    function renderLocation(loc) {
        location_ = loc || null;
        var v = EB.locationView(location_), b = document.getElementById('bench-loc');
        b.classList.remove('hidden');
        b.classList.toggle('empty', !v);
        b.classList.toggle('stale', !!(v && v.stale));
        b.title = v ? v.title + (v.source === 'manual' ? '\nClick: cambiarla o volver a la automática' : '\nClick: fijarla a mano') : 'Sin ubicación (geolocalización desactivada o sin red): agregar una';
        b.innerHTML = v ? '<i class="ti ti-' + v.icon + '" aria-hidden="true"></i>' + esc(v.label) +
                          '<span class="loc-src">' + (v.source === 'manual' ? 'manual' : 'auto') + '</span><i class="ti ti-pencil loc-ed" aria-hidden="true"></i>'
                        : '<i class="ti ti-plus" aria-hidden="true"></i>ubicación';
    }
    document.getElementById('bench-loc').addEventListener('click', function() {
        if (EBMeta.editing()) return;
        var host = document.getElementById('loc-editor'), btn = this;
        btn.classList.add('hidden');
        EBMeta.locationEditor(host, location_, function(changed, loc) {
            host.innerHTML = '';
            renderLocation(changed ? loc : location_);
        });
    });

    document.getElementById('btn-update').addEventListener('click', function() {
        var btn = this;
        var ref = prompt('Rama, tag o commit para probar (queda fijo ahí).\nVacío = último release, y vuelve a seguir los releases.', (update && update.pin) || '');
        if (ref === null) return;
        btn.disabled = true;
        EBAuth.fetch('api/update', {method: 'POST', headers: {'Content-Type': 'application/json'},
                                    body: JSON.stringify(ref.trim() ? {ref: ref.trim()} : {})})
            .then(function(r) { return r.json().then(function(d) { if (!r.ok) throw new Error(EB.errorText(d, r.status)); }); })
            .then(function() { document.getElementById('upd-state').textContent = 'Actualizando…'; })
            .catch(function(e) { alert('No se pudo actualizar: ' + e.message); })
            .then(function() { btn.disabled = false; });
    });

    // ── placas ──

    // Texto libre: también la nota y los valores de las propiedades ("lte"); "cat:valor" va por props.
    function searchText(d) {
        return [d.device_key, d.tty_name, d.sn, d.mac, d.hw_model, d.fw_project, d.fw_version, d.last_flash_user, d.lock_user,
                d.note, d.note_by, EB.propsSearchText(d.props)]
            .filter(Boolean).join(' ').toLowerCase();
    }

    // No se re-renderiza con un rename o un editor de nota/propiedades abierto (se perdería lo escrito).
    function render() {
        if (renaming || EBMeta.editing()) return;
        var q = document.getElementById('search').value;
        var catalog = EBMeta.catalog();
        var tab = TABS.filter(function(t) { return t[0] === filter; })[0];
        document.getElementById('tabs').innerHTML = TABS.map(function(t) {
            var n = devices.filter(t[2]).length;
            if (t[0] === 'avoid' && !n && filter !== 'avoid') return '';
            return '<button class="tab' + (t[0] === filter ? ' on' : '') + '" data-tab="' + t[0] + '">' + t[1] + '<b>' + n + '</b></button>';
        }).join('');
        var shown = devices.filter(function(d) {
            var l = EB.lockInfo(d);
            return tab[2](d) && EB.searchMatch(q, searchText(d), d.lock_user, l ? (l.reservation ? 'reserva' : 'flash') : '', d.props);
        });
        // Agrupada: un encabezado por grupo (ocupa la fila de la grilla); una placa con WiFi y LTE va en los dos.
        document.getElementById('boards').innerHTML = EB.groupBoards(shown, groupBy, catalog).map(function(g) {
            return (groupBy ? EB.groupHeaderHtml(g, groupBy) : '') + g.items.map(function(d) {
                var a = activity[d.tty_name];
                // bench viejo (sin /api/properties): sin botones de nota ni propiedades
                var meta = EB.metaSupported(d, EBMeta.catalogStatus()) !== false;
                return EB.boardCardHtml(d, {buckets: a && a.buckets, rename: true, meta: meta, catalog: catalog});
            }).join('');
        }).join('');
        document.getElementById('empty').classList.toggle('hidden', devices.length > 0);
    }

    function loadDevices() {
        return getJson('api/devices').then(function(list) { devices = list || []; render(); }).catch(function(e) { console.error(e); });
    }
    function loadActivity() {
        return getJson('api/activity?hours=24').then(function(a) { activity = a.devices || {}; render(); }).catch(function() {});
    }

    document.getElementById('tabs').addEventListener('click', function(e) {
        var t = e.target.closest('[data-tab]');
        if (t) { filter = t.dataset.tab; render(); }
    });
    // La búsqueda va en ?q= (replaceState): "← Placas" del monitor vuelve a esta URL con el filtro puesto.
    function syncQuery() {
        var u = new URL(location.href), q = document.getElementById('search').value;
        if (q) u.searchParams.set('q', q); else u.searchParams.delete('q');
        history.replaceState(null, '', u.pathname + u.search + u.hash);
    }
    document.getElementById('search').addEventListener('input', function() { syncQuery(); render(); });
    document.addEventListener('keydown', function(e) {
        var s = document.getElementById('search');
        if (e.key === '/' && !/^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement.tagName)) { e.preventDefault(); s.focus(); }
        if (e.key === 'Escape' && document.activeElement === s) { s.value = ''; syncQuery(); render(); s.blur(); }
    });

    function setSearch(q) { document.getElementById('search').value = q; syncQuery(); render(); }

    // Acciones de las cards: renombrar, copiar config, nota y propiedades, filtrar por el usuario
    // del lock o por una propiedad (chip → cat:valor).
    document.getElementById('boards').addEventListener('click', function(e) {
        var card = e.target.closest('.board');
        if (!card) return;
        var d = devices.filter(function(x) { return x.tty_name === card.dataset.tty; })[0];
        if (!d) return;
        var act = e.target.closest('[data-act]');
        var chip = e.target.closest('.prop-chip');
        if (chip) { if (!EBMeta.editing()) setSearch(chip.dataset.filter); return; }
        if (e.target.closest('.lock')) { setSearch('@' + d.lock_user); return; }
        if (!act) return;
        if (act.dataset.act === 'copy') copyConfig(d, act);
        if (act.dataset.act === 'rename') startRename(card, d);
        if ((act.dataset.act === 'note' || act.dataset.act === 'props') && !EBMeta.editing()) {
            var editor = card.querySelector('.meta-editor');
            var done = function(changed) { editor.innerHTML = ''; if (changed) loadDevices(); else render(); };
            if (act.dataset.act === 'note') EBMeta.noteEditor(editor, d, done);
            else EBMeta.propsEditor(editor, d, done);
        }
    });

    function startRename(card, d) {
        renaming = d.tty_name;
        var name = card.querySelector('.name');
        name.innerHTML = '<input class="rename-input" value="' + esc(d.device_key || '') + '" aria-label="Nombre de la placa">';
        var inp = name.querySelector('input');
        inp.focus(); inp.select();
        function done(save) {
            if (!renaming) return;
            var key = inp.value.trim();
            renaming = null;
            if (!save || !key || key === d.device_key) { render(); return; }
            EBAuth.fetch('api/devices/' + encodeURIComponent(d.mac), {method: 'PATCH', headers: {'Content-Type': 'application/json'},
                                                                      body: JSON.stringify({device_key: key})})
                .then(function(r) { if (!r.ok) return r.json().then(function(b) { alert('No se pudo renombrar: ' + EB.errorText(b, r.status)); }); })
                .then(loadDevices);
        }
        inp.addEventListener('keydown', function(e) { if (e.key === 'Enter') done(true); if (e.key === 'Escape') done(false); });
        inp.addEventListener('blur', function() { done(true); });
    }

    function copyConfig(d, btn) {
        var text = JSON.stringify({name: d.device_key || d.mac || d.tty_name,
                                   host: EB.basePath(location.pathname) === '/' ? location.hostname : 'auto',
                                   token: '', lock_user: '', lock_token: ''}, null, 2);
        function ok() { btn.innerHTML = '<i class="ti ti-check"></i>'; setTimeout(function() { btn.innerHTML = '<i class="ti ti-copy"></i>'; }, 1500); }
        if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(ok, function() { prompt('Config para deploy.py:', text); });
        else prompt('Config para deploy.py:', text);
    }

    // ?q=chip:esp32-s3 (los chips de device.html llevan acá con el filtro puesto)
    var q0 = new URLSearchParams(location.search).get('q');
    if (q0) document.getElementById('search').value = q0;
    loadBench(); EBMeta.loadCatalog().then(loadDevices); loadActivity();
    setInterval(loadDevices, 5000);
    setInterval(loadActivity, 30000);
    setInterval(loadBench, 15000);
</script>
</body>
</html>
